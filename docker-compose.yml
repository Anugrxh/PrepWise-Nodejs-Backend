version: "3.8"

services:
  backend:
    image: prepwise-backend:latest
    container_name: prepwise-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://appuser:apppassword@mongo:27017/prepwise?authSource=prepwise

    depends_on:
      mongo:
        condition: service_healthy

    # REAL resource limits (not ignored)
    mem_limit: 512m
    cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - prepwise-network

  mongo:
    image: mongo:7
    container_name: prepwise-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: prepwise

    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

    # DO NOT expose Mongo publicly
    # ports: ❌ intentionally removed

    mem_limit: 1g
    cpus: "1.0"

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - prepwise-network

volumes:
  mongo_data:

networks:
  prepwise-network:
    driver: bridge
